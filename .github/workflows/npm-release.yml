name: NPM Release

# The build job runs on every trigger, so a change that breaks the Node.js
# package fails CI on its pull request rather than at release time. The
# publish job only runs for a published GitHub release, or when started by
# hand with "publish" checked.
on:
  release:
    types: [published]
  push:
    branches:
      - develop
    paths:
      - 'libCacheSim-node/**'
      - 'scripts/sync_node_version.py'
      - '.github/workflows/npm-release.yml'
  pull_request:
    paths:
      - 'libCacheSim-node/**'
      - 'scripts/sync_node_version.py'
      - '.github/workflows/npm-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the package to npm (otherwise build, test and dry-run only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # The prebuilt addon needs a glibc at least as new as the one it was built
    # against, so build on the oldest supported runner to cover more systems.
    # Systems where it does not load compile from source on install.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize Node.js binding version
        run: python3 scripts/sync_node_version.py

      - name: Get package version
        id: package
        working-directory: libCacheSim-node
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libglib2.0-dev libzstd-dev

      - name: Build libCacheSim
        run: |
          cmake -G Ninja -B _build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          ninja -C _build libCacheSim

      - name: Vendor the static library and headers
        run: |
          mkdir -p libCacheSim-node/vendor/include
          cp _build/liblibCacheSim.a libCacheSim-node/vendor/
          cp -r libCacheSim/include/* libCacheSim-node/vendor/include/

      # npm ci installs the locked dependencies and compiles the addon from
      # source (there are no prebuilds yet), which checks the source-build path
      # users fall back to.
      - name: Install dependencies and build the addon from source
        working-directory: libCacheSim-node
        run: npm ci

      - name: Build the prebuilt N-API binary
        working-directory: libCacheSim-node
        run: |
          npm run prebuildify
          ls -lR prebuilds

      # Remove the source build so the tests load the prebuilt binary that
      # ships in the package.
      - name: Test the prebuilt binary
        working-directory: libCacheSim-node
        run: |
          rm -rf build
          npm test

      - name: Pack
        working-directory: libCacheSim-node
        run: npm pack

      - name: Install the packed tarball in a clean project
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --foreground-scripts "$GITHUB_WORKSPACE/libCacheSim-node/libcachesim-node-${VERSION}.tgz"
          if [ -d node_modules/libcachesim-node/build ]; then
            echo "::error::npm install compiled the addon instead of using the prebuilt binary"
            exit 1
          fi
          node -e "
            const c = require('libcachesim-node');
            const r = c.runSimulation('$GITHUB_WORKSPACE/data/cloudPhysicsIO.vscsi', 'vscsi', 's3fifo', '1mb');
            console.log(c.getVersion(), r);
            if (c.getVersion() !== process.env.VERSION || !(r.totalRequests > 0)) process.exit(1);
          "

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: libCacheSim-node/libcachesim-node-${{ steps.package.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Check the release tag matches version.txt
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match version.txt (v$VERSION); bump version.txt before releasing"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later, which Node.js 24 ships.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package

      # npm authenticates through the trusted publisher configured for this
      # workflow on npmjs.com. NPM_TOKEN is only used if that is not set up;
      # npm no longer accepts classic tokens.
      #
      # The dist-tag is passed explicitly because npm refuses to move "latest"
      # to a version lower than one already published, and 1.0.0 is on npm
      # from before the package version followed version.txt.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish "libcachesim-node-${VERSION}.tgz" --access public --provenance --tag "$DIST_TAG"
