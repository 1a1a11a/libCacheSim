name: CodeQL

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Match .github/workflows/build.yml (plain Release; no LSan — avoids sanitizer/CodeQL interaction)
  BUILD_TYPE: Release

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write  # upload the CodeQL results to code scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: cpp
          build-mode: manual
          config: |
            paths-ignore:
              - libCacheSim-node

      - name: Install build dependencies
        run: bash scripts/install_dependency.sh

      - name: Configure CMake
        run: cmake -G Ninja -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"

      - name: Build
        run: ninja -C "${{ github.workspace }}/build"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:cpp"
